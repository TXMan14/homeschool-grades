{% extends "grades/base.html" %}{% load ui %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div>
  <div class="crumbs"><a href="{{ cancel_url }}">{% icon "left" 14 %} Back</a></div>
  <h1>{{ title }}</h1>
</div></div>
<div class="card form-card"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {{ form }}
    <div class="form-actions"><button class="btn" type="submit">{% icon "check" 16 %} Save</button><a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
