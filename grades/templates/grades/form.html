{% extends "grades/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:720px">
  <h1>{{ title }}</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <div class="row"><button class="btn" type="submit">Save</button> <a class="btn secondary" href="{{ cancel_url }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
