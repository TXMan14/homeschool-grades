{% extends "grades/base.html" %}
{% block content %}
<div class="card" style="max-width:560px">
  <h1>Delete?</h1>
  <p>This will permanently delete <strong>{{ description }}</strong>.</p>
  <form method="post">{% csrf_token %}
    <div class="row"><button class="btn danger" type="submit">Yes, delete</button> <a class="btn secondary" href="{{ cancel_url }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
