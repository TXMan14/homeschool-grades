{% extends "grades/base.html" %}{% load ui %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><div class="crumbs"><a href="{% url 'settings' %}">Settings</a> {% icon "right" 14 %}</div><h1>Change password</h1></div></div>
<div class="card form-card"><div class="card-body">
  <form method="post">{% csrf_token %}
    <div class="form-grid one">{% for f in form %}{{ f.as_field_group }}{% endfor %}</div>
    <div class="form-actions"><button class="btn" type="submit">Update password</button><a class="btn btn-ghost" href="{% url 'settings' %}">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
